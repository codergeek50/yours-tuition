name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # weekly: catches newly published dependency vulnerabilities
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contrast
      - run: npm run build
      - run: npm audit --audit-level=high
